services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-local}/alzheimer-backend:${IMAGE_TAG:-latest}
    container_name: alzheimer-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
    volumes:
      - ./Backend/models:/app/models:ro
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./alzheimer-app
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        NGINX_CONF: nginx.proxy.conf
    image: ${DOCKERHUB_USER:-local}/alzheimer-frontend:${IMAGE_TAG:-latest}
    container_name: alzheimer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: alzheimer-network
