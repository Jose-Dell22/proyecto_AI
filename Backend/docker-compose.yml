# Local: backend only — API at http://localhost:5000
services:
  backend:
    build: .
    image: ${DOCKERHUB_USER:-local}/alzheimer-backend:${IMAGE_TAG:-latest}
    container_name: alzheimer-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - FLASK_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
